    <main class="contenido">
        <h2>Formulario de Contacto</h2>

        <form action="" method="get">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>

            <label for="apellido">Apellido:</label>
            <input type="text" id="apellido" name="apellido" placeholder="Tu apellido" required>

            <label for="correo">Correo electrónico:</label>
            <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>

            <label for="fecha">Fecha de contacto:</label>
            <input type="date" id="fecha" name="fecha">

            <label for="horario">Horario de contacto:</label>
            <select name="horario" id="horario">
                <option value="seleccione" disabled selected>Seleccione una opción</option>
                <option value="mañana">Mañana</option>
                <option value="tarde">Tarde</option>
                <option value="noche">Noche</option>
            </select>

            <label for="mensaje">Mensaje:</label>
            <textarea name="mensaje" id="mensaje" rows="4" placeholder="Escribe tu mensaje aquí..."></textarea>

            <button type="submit">Enviar</button>
        </form>
    </main>
